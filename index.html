<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orario 3DS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Orario 3DS · 2026/27</h1>
  <div class="row">
    <button id="prev">◀</button><span class="wk" id="wk"></span><button id="next">▶</button>
    <button id="today">Oggi</button>
  </div>
  <div class="row"><button class="p" id="add">+ Nuovo blocco</button><button id="reset">Ripristina base</button></div>
</header>
<div class="scroll"><div class="grid" id="grid"></div></div>
<div class="lab">Blocchi liberi: trascinali sull’orario (trascina un blocco qui per toglierlo). Doppio clic per modificare.</div>
<div class="tray" id="tray"></div>

<dialog id="dlg">
  <label>Testo</label><input type="text" id="dt">
  <label>Nota (opzionale)</label><input type="text" id="dn" placeholder="es. verifica, aula 12">
  <label>Colore</label><div class="sw" id="sw"></div>
  <div class="row" style="margin-top:14px;justify-content:space-between">
    <button id="del">Elimina</button>
    <span class="row"><button id="cx">Annulla</button><button class="p" id="ok">Salva</button></span>
  </div>
</dialog>
<script src="script.js"></script>
</body>
</html>
